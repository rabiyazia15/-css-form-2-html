<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    h2 {
        color: blue;
    }
    .text{
        color: brown;
    }
 .box {
    border: 2px solid green; 
    width: 400px; 
    height: 300px;
    padding: 50px;
}
.outer {
    border: 3px solid blueviolet;
    padding: 20px;
     }
     .inner{
        border: 3px solid red;
        margin: 10px;
     }
     .card p {
        color: purple;
     }
     .btn{
        display: inline-block;
        background-color: blue;
        color: white;
        padding: 10px 20px;
     }
     .btn:hover{
        background-color: tomato;
     }
</style>
<center>
<body>
    <h2>Heading</h2>
    <p class="text">Paragraph</p>
    <div class="box">MY HTML BOX</div>
    <div class="outer">
       <div="inner">INNER BOX</div>
       </div>
       <div class="card">
        <p>css practice</p>
       </div>
       <p> normal paragraph</p>
       <button class="btn">click</button>
    </div>
</body>
</center>
</html>
