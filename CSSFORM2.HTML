<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

</head>











<style>
        *{
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body{
            background: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .form-box{
            background: #fff;
            padding: 25px;
            width: 350px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .form-box h2{
            text-align: center;
            margin-bottom: 20px;
        }
        label{
            font-weight: bold;
            display: block;
            margin-top: 10px;
        }
        input, textarea{
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        textarea{
            resize: none;
            height: 80px;
        }
        button{
            width: 100%;
            margin-top: 15px;
            padding: 10px;
            background: #007bff;
            color: #fff;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover{
            background: #0056b3;
        }
    </style>
    </head>
<body>

<div class="form-box">
    <h2>Contact Form</h2>
    <form>
        <label>Name</label>
        <input type="text" placeholder="Enter your name" required>

        <label>Email</label>
        <input type="email" placeholder="Enter your email" required>

        <label>Message</label>
        <textarea placeholder="Write your message"></textarea>

        <button type="submit">Submit</button>
    </form>
</div>

</body>
</html>
