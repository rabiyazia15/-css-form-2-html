<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>simplform</title>
</head>
    <body>
        <h2>Contact form</h2>
        <form action="#"method="post">
             <label for="name">Name:</label><br>
             <input type="text"id="name"name="name"placeholder="write your name" required><br><br>

       <label for="email">Email:</label><br>
       <input type="email"id="email"name="email"placeholder="write your email"required><br><br>
       <label for="password">password:</label><br>
       <input type="password"id="password"name="password"placeholder="write your password here"required><br><br>

       <input type="submit"value="submit">
    </form>

    </body>
    </html>
